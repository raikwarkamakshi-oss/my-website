<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Something ♡</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 20%, #ead8bd 0 2px, transparent 3px),
        #c9ad89;
    background-size: 35px 35px;
    font-family: Georgia, serif;
    color: #4b3324;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.paper {
    width: 100%;
    max-width: 520px;
    min-height: 650px;
    background: #f7edda;
    padding: 45px 28px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(60, 35, 20, 0.25);
    transform: rotate(-1deg);
    position: relative;
    overflow: hidden;
}

.paper::before {
    content: "♡";
    position: absolute;
    top: 15px;
    left: 20px;
    font-size: 25px;
}

.paper::after {
    content: "✦";
    position: absolute;
    bottom: 15px;
    right: 22px;
    font-size: 22px;
}

.small {
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 25px;
    opacity: 0.7;
}

h1 {
    font-size: 43px;
    font-weight: normal;
    margin: 10px 0 20px;
}

.line {
    width: 100px;
    height: 1px;
    background: #8b6a4e;
    margin: 20px auto;
}

/* PHOTO */

.photo {
    display: block;
    width: 100%;
    max-width: 330px;
    height: auto;
    margin: 25px auto;
    padding: 10px;
    background: #fffaf0;
    border: 1px solid #d8c4a8;
    box-shadow: 0 8px 18px rgba(60, 35, 20, 0.25);
    transform: rotate(2deg);
}

p {
    font-size: 18px;
    line-height: 1.8;
    margin-top: 25px;
}

.open {
    display: inline-block;
    margin-top: 35px;
    padding: 13px 30px;
    border: 1px solid #76563e;
    color: #4b3324;
    text-decoration: none;
    font-size: 16px;
    background: #ead8bd;
    transition: 0.3s;
}

.open:hover {
    background: #d7bd99;
    transform: scale(1.05);
}

</style>
</head>

<body>

<div class="paper">

    <div class="small">
        a little corner of the internet
    </div>

    <h1>
        For You ♡
    </h1>

    <div class="line"></div>

    <img
        class="photo"
        src="IMG_20260320_194750_488.jpg"
        alt="Our photo"
    >

    <p>
        Some things are better<br>
        kept in little pieces of paper.
    </p>

    <a class="open" href="letter.html">
        Open ♡
    </a>

</div>

</body>
</html>
