<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ♡</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #f8e8e8;
            font-family: Georgia, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 500px;
            min-height: 650px;
            background: #fffaf5;
            border-radius: 20px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .heart {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 38px;
            color: #6d3b3b;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            color: #654b4b;
        }

        .button {
            display: inline-block;
            margin: 30px auto 0;
            padding: 14px 28px;
            background: #6d3b3b;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="heart">♡</div>

        <h1>For You</h1>

        <p>
            A little corner of the internet<br>
            made especially for you.
        </p>

        <a class="button" href="#next">Open ♡</a>

    </div>

</body>
</html>
