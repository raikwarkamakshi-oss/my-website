<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Memories ♡</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 20%, #ead8bd 0 2px, transparent 3px),
        #c9ad89;
    background-size: 38px 38px;
    font-family: Georgia, serif;
    color: #4b3324;
    padding: 30px 20px;
}

.page {
    max-width: 900px;
    margin: auto;
    background: #f7edda;
    padding: 40px 25px 50px;
    box-shadow: 0 12px 30px rgba(60, 35, 20, 0.25);
}

h1 {
    text-align: center;
    font-family: "Segoe Print", "Comic Sans MS", cursive;
    font-size: 38px;
    font-weight: normal;
    margin: 5px 0 8px;
}

.subtitle {
    text-align: center;
    font-size: 14px;
    letter-spacing: 2px;
    opacity: 0.7;
    margin-bottom: 30px;
}

.line {
    width: 90px;
    height: 1px;
    background: #8b6a4e;
    margin: 0 auto 35px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

.photo-card {
    background: #fffaf0;
    padding: 10px 10px 18px;
    box-shadow: 0 7px 16px rgba(60, 35, 20, 0.22);
}

.photo-card:nth-child(odd) {
    transform: rotate(-2deg);
}

.photo-card:nth-child(even) {
    transform: rotate(2deg);
}

.photo-card img {
    width: 100%;
    display: block;
}

.caption {
    text-align: center;
    margin-top: 12px;
    font-family: "Segoe Print", "Comic Sans MS", cursive;
    font-size: 14px;
}

.back {
    display: block;
    width: fit-content;
    margin: 40px auto 0;
    padding: 11px 24px;
    border: 1px solid #76563e;
    color: #4b3324;
    text-decoration: none;
    background: #ead8bd;
}

@media (max-width: 600px) {

    .gallery {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 32px;
    }

}

</style>

</head>

<body>

<div class="page">

    <h1>Our Memories ♡</h1>

    <div class="subtitle">
        little moments, big memories
    </div>

    <div class="line"></div>

    <div class="gallery">

        <div class="photo-card">
            <img src="PHOTO1.jpg" alt="Memory 1">
            <div class="caption">one of my favourite moments ♡</div>
        </div>

        <div class="photo-card">
            <img src="PHOTO2.jpg" alt="Memory 2">
            <div class="caption">us being us ♡</div>
        </div>

        <div class="photo-card">
            <img src="PHOTO3.jpg" alt="Memory 3">
            <div class="caption">a little moment to remember ✦</div>
        </div>

        <div class="photo-card">
            <img src="PHOTO4.jpg" alt="Memory 4">
            <div class="caption">forever keeping this one ♡</div>
        </div>

    </div>

    <a class="back" href="letter.html">
        ← Back to Letter
    </a>

</div>

</body>
</html>
