<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Memories ♡</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 20%, #ead8bd 0 2px, transparent 3px),
        radial-gradient(circle at 80% 70%, #ead8bd 0 2px, transparent 3px),
        #c9ad89;
    background-size: 38px 38px;
    font-family: Georgia, serif;
    color: #4b3324;
    padding: 30px 18px;
}

.page {
    max-width: 900px;
    margin: auto;
    background: #f7edda;
    padding: 45px 22px 55px;
    box-shadow: 0 12px 30px rgba(60, 35, 20, 0.25);
    position: relative;
}

.page::before {
    content: "♡  ✦  ♡";
    position: absolute;
    top: 15px;
    left: 18px;
    font-size: 18px;
}

.page::after {
    content: "✦  ♡";
    position: absolute;
    bottom: 15px;
    right: 18px;
    font-size: 18px;
}

h1 {
    text-align: center;
    font-family: "Segoe Print", "Comic Sans MS", cursive;
    font-size: 38px;
    font-weight: normal;
    margin: 5px 0 8px;
}

.subtitle {
    text-align: center;
    font-size: 13px;
    letter-spacing: 2px;
    opacity: 0.7;
    margin-bottom: 25px;
}

.line {
    width: 90px;
    height: 1px;
    background: #8b6a4e;
    margin: 0 auto 35px;
}

/* PHOTO GRID */

.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 30px 22px;
    align-items: start;
}

.photo-card {
    background: #fffaf0;
    padding: 10px 10px 18px;
    box-shadow: 0 7px 16px rgba(60, 35, 20, 0.22);
}

.photo-card:nth-child(odd) {
    transform: rotate(-2deg);
}

.photo-card:nth-child(even) {
    transform: rotate(2deg);
}

.photo-card img {
    width: 100%;
    height: auto;
    display: block;
}

/* CAPTIONS */

.caption {
    text-align: center;
    margin-top: 12px;
    font-family: "Segoe Print", "Comic Sans MS", cursive;
    font-size: 14px;
    line-height: 1.5;
}

/* LITTLE DECORATION */

.doodle {
    text-align: center;
    font-size: 22px;
    margin: 35px 0 5px;
    letter-spacing: 7px;
}

/* BACK BUTTON */

.back {
    display: block;
    width: fit-content;
    margin: 40px auto 0;
    padding: 11px 25px;
    border: 1px solid #76563e;
    color: #4b3324;
    text-decoration: none;
    background: #ead8bd;
    font-family: Georgia, serif;
    transition: 0.3s;
}

.back:hover {
    background: #d7bd99;
    transform: scale(1.05);
}

/* MOBILE */

@media (max-width: 600px) {

    .gallery {
        grid-template-columns: 1fr;
        gap: 35px;
    }

    h1 {
        font-size: 32px;
    }

    .page {
        padding: 40px 18px 50px;
    }

}

</style>

</head>

<body>

<div class="page">

    <h1>Our Memories ♡</h1>

    <div class="subtitle">
        little moments, big memories
    </div>

    <div class="line"></div>


    <div class="gallery">


        <div class="photo-card">

            <img
                src="file_000000009bfc720b9b9c5922115741aa.png"
                alt="Memory 1"
            >

            <div class="caption">
                one of my favourite moments ♡
            </div>

        </div>


        <div class="photo-card">

            <img
                src="Snapchat-742070198.jpg"
                alt="Memory 2"
            >

            <div class="caption">
                us being us ♡
            </div>

        </div>


        <div class="photo-card">

            <img
                src="Snapchat-1716547566.jpg"
                alt="Memory 3"
            >

            <div class="caption">
                a little moment to remember ✦
            </div>

        </div>


        <div class="photo-card">

            <img
                src="Screenshot_2026_0916_144246.jpg"
                alt="Memory 4"
            >

            <div class="caption">
                this one has a special place in my heart ♡
            </div>

        </div>


        <div class="photo-card">

            <img
                src="Screenshot_2026_0717_163529.jpg"
                alt="Memory 5"
            >

            <div class="caption">
                another little memory ♡
            </div>

        </div>


        <div class="photo-card">

            <img
                src="Picsart_26-06-05_00-48-40-569.jpg"
                alt="Memory 6"
            >

            <div class="caption">
                keeping this moment forever ✦
            </div>

        </div>


        <div class="photo-card">

            <img
                src="IMG_20260320_194757_982.jpg"
                alt="Memory 7"
            >

            <div class="caption">
                one more for our little scrapbook ♡
            </div>

        </div>


        <div class="photo-card">

            <img
                src="IMG_20260320_194750_488.jpg"
                alt="Memory 8"
            >

            <div class="caption">
                and this one too ♡
            </div>

        </div>


    </div>


    <div class="doodle">
        ♡ ✦ ♡ ✦ ♡
    </div>


    <a class="back" href="letter.html">
        ← Back to Letter
    </a>

</div>

</body>
</html>
