<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Memories ♡</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 20%, #ead8bd 0 2px, transparent 3px),
        #c9ad89;
    background-size: 38px 38px;
    font-family: Georgia, serif;
    color: #4b3324;
    padding: 30px 18px;
}

.page {
    max-width: 900px;
    margin: auto;
    background: #f7edda;
    padding: 45px 22px 55px;
    box-shadow: 0 12px 30px rgba(60,35,20,0.25);
}

h1 {
    text-align: center;
    font-family: "Segoe Print", "Comic Sans MS", cursive;
    font-size: 38px;
    font-weight: normal;
}

.subtitle {
    text-align: center;
    font-size: 13px;
    letter-spacing: 2px;
    opacity: 0.7;
    margin-bottom: 25px;
}

.line {
    width: 90px;
    height: 1px;
    background: #8b6a4e;
    margin: 0 auto 35px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 30px 22px;
}

.photo-card {
    background: #fffaf0;
    padding: 10px 10px 18px;
    box-shadow: 0 7px 16px rgba(60,35,20,0.22);
}

.photo-card:nth-child(odd) {
    transform: rotate(-2deg);
}

.photo-card:nth-child(even) {
    transform: rotate(2deg);
}

.photo-card img {
    width: 100%;
    height: auto;
    display: block;
}

.caption {
    text-align: center;
    margin-top: 12px;
    font-family: "Segoe Print", "Comic Sans MS", cursive;
    font-size: 14px;
}

.buttons {
    text-align: center;
    margin-top: 45px;
}

.button {
    display: inline-block;
    margin: 7px;
    padding: 12px 24px;
    border: 1px solid #76563e;
    color: #4b3324;
    text-decoration: none;
    background: #ead8bd;
    font-family: Georgia, serif;
}

.doodle {
    text-align: center;
    font-size: 22px;
    margin-top: 35px;
}

@media (max-width: 600px) {
    .gallery {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 32px;
    }
}
</style>

</head>

<body>

<div class="page">

little moments, big memories

</html>
