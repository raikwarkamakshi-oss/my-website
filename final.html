<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Babu ♡</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 20%, #ead8bd 0 2px, transparent 3px),
        #c9ad89;
    background-size: 38px 38px;
    font-family: Georgia, serif;
    color: #4b3324;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.paper {
    width: 100%;
    max-width: 550px;
    min-height: 650px;
    background: #f7edda;
    padding: 55px 28px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(60,35,20,0.25);
    transform: rotate(-1deg);
    position: relative;
}

.paper::before {
    content: "♡";
    position: absolute;
    top: 18px;
    left: 22px;
    font-size: 28px;
}

.paper::after {
    content: "✦";
    position: absolute;
    bottom: 18px;
    right: 25px;
    font-size: 25px;
}

.small {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 25px;
}

h1 {
    font-family: "Segoe Print", "Comic Sans MS", cursive;
    font-size: 38px;
    font-weight: normal;
    margin: 15px 0;
}

.line {
    width: 90px;
    height: 1px;
    background: #8b6a4e;
    margin: 25px auto;
}

.message {
    font-family: "Segoe Print", "Comic Sans MS", cursive;
    font-size: 21px;
    line-height: 2;
    margin-top: 30px;
}

.big {
    font-size: 27px;
}

.hearts {
    font-size: 25px;
    margin: 30px 0;
}

.back {
    display: inline-block;
    margin-top: 30px;
    padding: 11px 23px;
    border: 1px solid #76563e;
    color: #4b3324;
    text-decoration: none;
    background: #ead8bd;
}

</style>
</head>

<body>

<div class="paper">

    <div class="small">
        one last little page ♡
    </div>

    <h1>
        Happy Boyfriend's Day 🤎
    </h1>

    <div class="line"></div>

    <div class="message">

        Happy Boyfriend's Day to my<br>

        <span class="big">
        babu, shona, babyyy 😭🤎
        </span>

        <br><br>

        Puchu 🥹🫶🏻<br>
        Meri jaan 😭❤️<br>
        Betuuu 🫂🤎

        <br><br>

        I LOVEEEE YOUUUU<br>
        SOOOOOOO MUCHHHHH 😭😭❤️

        <br>

        ummahhhh 😝💋

    </div>

    <div class="hearts">
        ♡ ✦ ♡ ✦ ♡
    </div>

    <a class="back" href="littlethings.html">
        ← Back
    </a>

</div>

</body>
</html>
