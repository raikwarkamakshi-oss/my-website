<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Letter ♡</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #c9ad89;
    font-family: Georgia, serif;
    color: #4b3324;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.paper {
    width: 100%;
    max-width: 520px;
    min-height: 650px;
    background: #f7edda;
    padding: 50px 30px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(60, 35, 20, 0.25);
    transform: rotate(-1deg);
}

h1 {
    font-size: 38px;
    font-weight: normal;
    margin-bottom: 30px;
}

.line {
    width: 100px;
    height: 1px;
    background: #8b6a4e;
    margin: 20px auto 30px;
}

p {
    font-size: 18px;
    line-height: 1.9;
}

.back {
    display: inline-block;
    margin-top: 35px;
    padding: 12px 25px;
    border: 1px solid #76563e;
    color: #4b3324;
    text-decoration: none;
    background: #ead8bd;
}

</style>
</head>

<body>

<div class="paper">

    <h1>A Little Letter ♡</h1>

    <div class="line"></div>

    <p>
        This little corner is just for you.
        <br><br>
        More memories are waiting here...
    </p>

    <a class="back" href="index.html">
        ← Back
    </a>

</div>

</body>
</html>
